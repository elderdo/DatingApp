<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Weather Forecast</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 40px;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        margin-top: 20px;
      }
      th,
      td {
        border: 1px solid #ddd;
        padding: 8px;
        text-align: left;
      }
      th {
        background-color: #f2f2f2;
      }
    </style>
  </head>
  <body>
    <h1>Weather Forecast</h1>
    <button onclick="getWeather()">Load Forecast</button>

    <table id="weatherTable">
      <thead>
        <tr>
          <th>Date</th>
          <th>Temp (°C)</th>
          <th>Temp (°F)</th>
          <th>Summary</th>
        </tr>
      </thead>
      <tbody>
        <!-- Data will load here -->
      </tbody>
    </table>
    <br />
    <a href="/api/members">Members</a>
    <br />
    <!-- Visual link to hop over to the Scalar API Interface -->
    <a
      href="/scalar/v1"
      target="_blank"
      rel="noopener noreferrer"
      style="
        font-family: sans-serif;
        font-weight: bold;
        color: #3b82f6;
        text-decoration: none;
      "
    >
      🚀 Open API Documentation
    </a>

    <script>
      async function getWeather() {
        try {
          const response = await fetch("/api/weatherforecast");
          const data = await response.json();

          const tbody = document.querySelector("#weatherTable tbody");
          tbody.innerHTML = "";

          data.forEach((item) => {
            const row = `<tr>
                        <td>${new Date(item.date).toLocaleDateString()}</td>
                        <td>${item.temperatureC}</td>
                        <td>${item.temperatureF}</td>
                        <td>${item.summary}</td>
                    </tr>`;
            tbody.innerHTML += row;
          });
        } catch (error) {
          console.error("Error fetching weather:", error);
        }
      }

      // Load automatically on page open
      getWeather();
    </script>
  </body>
</html>
